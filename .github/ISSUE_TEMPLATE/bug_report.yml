name: Bug report
description: Report a reproducible problem with CodexKit
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove secrets and private data before submitting.
  - type: input
    id: version
    attributes:
      label: CodexKit version
      placeholder: 0.1.8
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 22
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
